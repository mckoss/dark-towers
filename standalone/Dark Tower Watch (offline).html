r-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">\n          <div>Time<\u002Fdiv><div>Kind of flight<\u002Fdiv><div>Arriving or leaving<\u002Fdiv><div>Flight<\u002Fdiv><div>Aircraft<\u002Fdiv><div>Other airport<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ nightFlights }}\" as=\"f\" hint-placeholder-count=\"12\">\n          <div style=\"display: grid; grid-template-columns: 92px 150px 110px 1fr 90px 1.4fr; align-items: center; border-bottom: 1px solid #d7d3d3; padding: 11px 0; font-size: 14px;\">\n            <div style=\"font-weight: 600; font-variant-numeric: tabular-nums;\">{{ f.time }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 8px; color: {{ f.opColor }}; font-weight: {{ f.opWeight }};\"><span style=\"width: 8px; height: 8px; display: block; background: {{ f.dot }};\"><\u002Fspan>{{ f.cat }}<\u002Fdiv>\n            <div style=\"color: #605d5d;\">{{ f.dir }}<\u002Fdiv>\n            <div style=\"font-weight: 600;\">{{ f.name }}<\u002Fdiv>\n            <div style=\"color: #605d5d;\">{{ f.type }}<\u002Fdiv>\n            <div style=\"color: #605d5d;\">{{ f.other }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isIncident }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"padding: 16px 24px; border-bottom: 1px solid #d7d3d3;\">\n        <button sc-camel-on-click=\"{{ goPAE }}\" style=\"background: none; border: none; padding: 0; cursor: pointer; font-size: 13px; font-weight: 600; color: #ae1800;\">← Back to the Paine Field record<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 40px 24px; border-right: 2px solid #201e1d;\">\n          <div style=\"display: flex; align-items: center; gap: 14px;\">\n            <span style=\"display: inline-block; padding: 5px 10px; background: #ec3013; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;\">{{ incSeverity }}<\u002Fspan>\n            <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7d7979;\">{{ incId }}<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin: 20px 0 0; font-size: 44px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; max-width: 20ch;\">{{ incHeadline }}<\u002Fh1>\n          <div style=\"margin-top: 16px; font-size: 16px; color: #605d5d;\">{{ incWhen }} · Paine Field, Everett WA · tower closed<\u002Fdiv>\n          <p style=\"margin: 24px 0 0; max-width: 58ch; font-size: 17px; line-height: 1.6; color: #444141;\">{{ incNote }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-rows: 1fr 1fr 1fr;\">\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">How close, side to side<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 14px; margin-top: 10px;\">\n              <div style=\"font-size: 48px; font-weight: 900; letter-spacing: -0.03em; color: #ec3013; line-height: 0.9;\">{{ incLateral }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #605d5d;\">a controller would keep them at least 3 NM apart<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Vertical separation<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 14px; margin-top: 10px;\">\n              <div style=\"font-size: 48px; font-weight: 900; letter-spacing: -0.03em; color: #ec3013; line-height: 0.9;\">{{ incVertical }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #605d5d;\">a controller would keep them at least 1,000' apart<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Distance from the airport<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 14px; margin-top: 10px;\">\n              <div style=\"font-size: 48px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.9;\">{{ incDist }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #605d5d;\">inside the 10 NM ring<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"border-right: 2px solid #201e1d;\">\n          <x-import component-from-global-scope=\"incident-replay\" from=\"f14569a1-eb40-4a89-9572-1295c57369cb#/incident-replay.js\" incident=\"{{ incId }}\" tiles=\"off\" height=\"520\" hint-size=\"100%,600px\"><\u002Fx-import>\n          <div style=\"padding: 14px 24px; border-top: 1px solid #d7d3d3; font-size: 12px; color: #7d7979;\">Offline copy — the basemap is a stored snapshot of the area (map data © OpenStreetMap contributors). Replay runs in accelerated time. Each aircraft's full path is dashed; the solid trail is where it has flown so far, and the thin line between the two is their separation. Other traffic that night is greyed behind them.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\"><span style=\"width: 22px; height: 4px; background: #ec3013; display: block;\"><\u002Fspan><span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Aircraft A<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top: 12px; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;\">{{ incAIdent }}<\u002Fdiv>\n            <div style=\"margin-top: 6px; font-size: 15px; color: #605d5d;\">{{ incADesc }}<\u002Fdiv>\n            <div style=\"margin-top: 12px; font-size: 15px;\">Altitude at closest point: <strong>{{ incAAlt }}<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\"><span style=\"width: 22px; height: 4px; background: #201e1d; display: block;\"><\u002Fspan><span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Aircraft B<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top: 12px; font-size: 28px; font-weight: 900; letter-spacing: -0.02em;\">{{ incBIdent }}<\u002Fdiv>\n            <div style=\"margin-top: 6px; font-size: 15px; color: #605d5d;\">{{ incBDesc }}<\u002Fdiv>\n            <div style=\"margin-top: 12px; font-size: 15px;\">Altitude at closest point: <strong>{{ incBAlt }}<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; background: #eae9e9;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">What we know, and don't<\u002Fdiv>\n            <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #444141;\">We do not know whether this event was reported to anyone. With the tower closed there was no controller watching to file a report, and a pilot cannot report an aircraft they never saw. What we can show is what the position data recorded.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 36px 24px 64px;\">\n        <h2 style=\"margin: 0 0 16px; font-size: 20px; font-weight: 800;\">Other close approaches at Paine Field<\u002Fh2>\n        <div style=\"display: grid; grid-template-columns: 200px 1fr 120px 120px; border-top: 2px solid #201e1d; border-bottom: 1px solid #d7d3d3; padding: 10px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">\n          <div>Reference<\u002Fdiv><div>Aircraft<\u002Fdiv><div>Lateral<\u002Fdiv><div>Vertical<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ otherIncidents }}\" as=\"i\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ i.open }}\" style=\"display: grid; width: 100%; grid-template-columns: 200px 1fr 120px 120px; align-items: center; text-align: left; background: none; border: none; border-bottom: 1px solid #d7d3d3; padding: 16px 0; cursor: pointer;\" style-hover=\"{ background: '#eae9e9' }\">\n            <div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: #7d7979;\">{{ i.id }}<\u002Fdiv>\n            <div style=\"font-size: 16px; font-weight: 600;\">{{ i.pair }}<\u002Fdiv>\n            <div style=\"font-size: 16px; font-weight: 800; color: #ec3013;\">{{ i.lateral }}<\u002Fdiv>\n            <div style=\"font-size: 16px; font-weight: 800; color: #ec3013;\">{{ i.vertical }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 56px 24px; border-right: 2px solid #201e1d;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;\">Method<\u002Fdiv>\n          <h1 style=\"margin: 20px 0 0; font-size: 46px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; max-width: 18ch;\">What this site counts, and how.<\u002Fh1>\n          <p style=\"margin: 24px 0 0; max-width: 58ch; font-size: 17px; line-height: 1.6; color: #444141;\">Many smaller airports have control towers that are staffed only part of the day, and some have no tower at all. Those hours, where they exist, were set when the airport had no passenger flights. They have not changed. The passenger flights have arrived. This site does not argue that from anecdote — it counts the flights.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 56px 24px; background: #eae9e9;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Sources<\u002Fdiv>\n          <div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 14px; font-size: 15px; line-height: 1.5; color: #444141;\">\n            <div>FlightAware — arrival and departure records, and the position signals each aircraft broadcasts.<\u002Fdiv>\n            <div>FAA Chart Supplement — the official published tower hours for each airport.<\u002Fdiv>\n            <div>Published airline schedules — to tell passenger flights apart from private ones.<\u002Fdiv>\n            <div>OpenStreetMap — basemap tiles.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 36px 24px; border-right: 1px solid #d7d3d3;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Step one<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;\">Collect every flight while the tower is closed<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #444141;\">For each night we list every arrival and departure between the tower closing and reopening the next morning, in local time. Where an airport has no tower, we use the hours a tower would ordinarily be staffed nearby. Flights are grouped by the evening they belong to, so a 1 a.m. landing is filed under the night before.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 36px 24px; border-right: 1px solid #d7d3d3;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Step two<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;\">Keep only the paths close to the airport<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #444141;\">Each flight's path is trimmed to the positions within 10 nautical miles of the airport — about 11.5 road miles — and within the hours the tower was closed. Flights that pass nearby at other times are dropped.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 36px 24px;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Step three<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em;\">Measure how close aircraft came to each other<\u002Fh3>\n          <p style=\"margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #444141;\">Positions are lined up to a common clock and every pair of aircraft is measured. When two aircraft are less than 3 nautical miles apart and less than 1,000 feet apart vertically at the same moment, we flag it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ec3013; color: #fff; padding: 56px 24px; border-bottom: 2px solid #201e1d;\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.8;\">The standard<\u002Fdiv>\n        <div style=\"margin-top: 18px; font-size: 40px; font-weight: 900; line-height: 1.08; letter-spacing: -0.03em; max-width: 26ch;\">With a controller on duty, aircraft are kept at least 3 nautical miles apart, or 1,000 feet apart vertically. When the tower is closed, nothing enforces this safety margin.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 40px 24px; border-right: 2px solid #201e1d;\">\n          <h3 style=\"margin: 0; font-size: 22px; font-weight: 800;\">What a flagged event is, and what it is not<\u002Fh3>\n          <p style=\"margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #444141;\">A flag means two aircraft were closer than a controller would have allowed. It is not a finding that either pilot did anything wrong, and it is not an official ruling of any kind. When the tower is closed, pilots are legally permitted to fly closer than these distances as long as they see each other to avoid collisions. That is the point: an airliner coming in to land and a training aircraft circling the field share the same air with nothing between them but a radio call and a pair of eyes.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 24px;\">\n          <h3 style=\"margin: 0; font-size: 22px; font-weight: 800;\">Known limitations<\u002Fh3>\n          <div style=\"margin-top: 14px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.6; color: #444141;\">\n            <div>Aircraft that do not broadcast a position signal do not appear at all, so these counts are a floor, not a total.<\u002Fdiv>\n            <div>Broadcast altitude is not corrected for local air pressure, so altitude figures carry roughly ±100 feet.<\u002Fdiv>\n            <div>Landing and takeoff times are sometimes estimated rather than measured; where the measured time is missing, the estimate is used.<\u002Fdiv>\n            <div>Coverage close to the ground is uneven, so the lowest parts of some flight paths are missing.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 48px 24px; border-right: 2px solid #201e1d;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;\">Who we are<\u002Fdiv>\n          <h2 style=\"margin: 18px 0 0; font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.025em; max-width: 24ch;\">A citizen project, built on public data.<\u002Fh2>\n          <p style=\"margin: 18px 0 0; max-width: 58ch; font-size: 16px; line-height: 1.6; color: #444141;\">Dark Tower Watch is not run by the FAA, an airport, an airline, or any government body. It is the work of two residents who live under these flight paths. Everything on the site is drawn from publicly available ADS-B position data — the same signals aircraft broadcast for anyone to receive — and from published tower hours and airline schedules. Nothing here is confidential, and none of it required special access.<\u002Fp>\n          <p style=\"margin: 14px 0 0; max-width: 58ch; font-size: 16px; line-height: 1.6; color: #444141;\">If you see something we have wrong, tell us. Corrections improve the record.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 48px 24px; background: #eae9e9;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Contact<\u002Fdiv>\n          <div style=\"margin-top: 18px; display: flex; flex-direction: column; gap: 20px;\">\n            <div>\n              <div style=\"font-size: 18px; font-weight: 800; letter-spacing: -0.01em;\">Mike Koss<\u002Fdiv>\n              <a href=\"mailto:mckoss@gmail.com?subject=Dark%20Tower%20Watch\" style=\"display: inline-block; margin-top: 4px; font-size: 16px;\">mckoss@gmail.com<\u002Fa>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 18px; font-weight: 800; letter-spacing: -0.01em;\">Kevin Stoltz<\u002Fdiv>\n              <a href=\"mailto:kstoltz@citynetwork.com?subject=Dark%20Tower%20Watch\" style=\"display: inline-block; margin-top: 4px; font-size: 16px;\">kstoltz@citynetwork.com<\u002Fa>\n            <\u002Fdiv>\n            <a href=\"mailto:mckoss@gmail.com,kstoltz@citynetwork.com?subject=Dark%20Tower%20Watch%20feedback\" style=\"padding: 14px 20px; background: #ec3013; color: #fff; border: none; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left; border-bottom: none;\">Send us feedback<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 40px 24px 72px; display: flex; align-items: baseline; justify-content: space-between; gap: 24px;\">\n        <div style=\"font-size: 14px; color: #7d7979; max-width: 60ch;\">Prototype built on one week of records for Paine Field, 12–18 August 2026. The flight paths drawn on the maps are reconstructed from those records for this prototype.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goPAE }}\" style=\"padding: 14px 20px; background: #ec3013; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left; white-space: nowrap;\" style-hover=\"{ background: '#dd2b0f' }\">See the record<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;homeVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;map&quot;,&quot;ledger&quot;],&quot;default&quot;:&quot;map&quot;,&quot;tsType&quot;:&quot;'map' | 'ledger'&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home',\n    airportCode: 'PAE',\n    nightKey: '2026-08-18',\n    incidentId: null,\n    mapMode: null,\n    homeVariant: null,\n    ready: false,\n    addValue: '',\n    addEmail: '',\n    addSubmitted: false\n  };\n\n  componentDidMount() {\n    const wait = setInterval(() => {\n      if (window.PAE) { clearInterval(wait); this.setState({ ready: true }); }\n    }, 50);\n    this._pick = (e) => {\n      const code = e.detail && e.detail.code;\n      if (!code) return;\n      this.setState({ page: 'airport', airportCode: code });\n      window.scrollTo({ top: 0 });\n    };\n    document.addEventListener('airportpick', this._pick);\n  }\n  componentWillUnmount() { document.removeEventListener('airportpick', this._pick); }\n\n  t12(hhmm) {\n    const [h, m] = hhmm.split(':').map(Number);\n    const ap = h >= 12 ? 'PM' : 'AM';\n    const hr = h % 12 === 0 ? 12 : h % 12;\n    return String(hr).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ' ' + ap;\n  }\n\n  calendarCells(D) {\n    const end = new Date(Date.UTC(2026, 7, 18));\n    const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\n    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    const cells = [];\n    for (let i = 29; i >= 0; i--) {\n      const d = new Date(end.getTime() - i * 86400000);\n      const key = d.toISOString().slice(0, 10);\n      const night = D.nights.find((n) => n.date === key);\n      const sel = this.state.nightKey === key;\n      let bg = '#f3f2f2', fg = '#bab6b6', border = '#eae9e9', opsLabel = '—';\n      if (night) {\n        const ops = night.total;\n        bg = ops >= 20 ? '#444141' : ops >= 15 ? '#7d7979' : ops >= 12 ? '#9b9797' : '#d7d3d3';\n        fg = ops >= 15 ? '#f8f4f4' : '#201e1d';\n        opsLabel = ops + ' flights';\n        border = '#eae9e9';\n        if (night.incidents > 0) { bg = '#ec3013'; fg = '#fff'; }\n      }\n      if (sel) border = '#201e1d';\n      cells.push({\n        key, dow: dows[d.getUTCDay()],\n        day: d.getUTCDate() === 1 || i === 29 ? months[d.getUTCMonth()] + ' ' + d.getUTCDate() : String(d.getUTCDate()),\n        opsLabel, bg, fg, border,\n        title: night ? night.label + ' — ' + night.total + ' flights' : key + ' — no data yet',\n        pick: night ? () => this.setState({ nightKey: key, page: 'airport' }) : () => {}\n      });\n    }\n    return cells;\n  }\n\n  incidentRow(i) {\n    return {\n      id: i.id,\n      pair: i.a.ident + ' × ' + i.b.ident,\n      time: this.t12(i.time.slice(0, 5)),\n      severity: i.severity === 'severe' ? 'Very close' : 'Closer than allowed',\n      lateral: i.lateral.toFixed(1) + ' NM',\n      vertical: i.vertical.toLocaleString() + \"'\",\n      open: () => this.setState({ page: 'incident', incidentId: i.id })\n    };\n  }\n\n  renderVals() {\n    const D = window.PAE;\n    const s = this.state;\n    const variant = s.homeVariant || this.props.homeVariant || 'map';\n    const mode = 'abstract';\n    const base = {\n      isHome: s.page === 'home',\n      isAirports: s.page === 'airports',\n      isAirport: s.page === 'airport',\n      isIncident: s.page === 'incident',\n      isAbout: s.page === 'about',\n      homeMapFirst: s.page === 'home' && variant === 'map',\n      homeLedger: s.page === 'home' && variant === 'ledger',\n      homeLetter: variant === 'map' ? 'A' : 'B',\n      mapMode: mode,\n      selectedCode: s.airportCode,\n      goHome: () => this.setState({ page: 'home' }),\n      goPAE: () => { this.setState({ page: 'airport', airportCode: 'PAE' }); window.scrollTo({ top: 0 }); },\n      goAbout: () => this.setState({ page: 'about' }),\n      goAirports: () => { this.setState({ page: 'airports' }); window.scrollTo({ top: 0 }); },\n      goList: () => { this.setState({ page: 'airports' }); window.scrollTo({ top: 0 }); },\n      toggleHome: () => this.setState({ page: 'home', homeVariant: variant === 'map' ? 'ledger' : 'map' }),\n      addValue: s.addValue,\n      addEmail: s.addEmail,\n      addSubmitted: s.addSubmitted,\n      addMessage: s.addValue\n        ? 'Thanks — ' + s.addValue + ' has been added to the request list.'\n        : 'Enter an airport code or a city and state.',\n      onAddChange: (e) => this.setState({ addValue: e.target.value, addSubmitted: false }),\n      onEmailChange: (e) => this.setState({ addEmail: e.target.value }),\n      submitAdd: () => this.setState({ addSubmitted: true })\n    };\n    if (!D) return base;\n\n    const night = D.nights.find((n) => n.date === s.nightKey) || D.nights[D.nights.length - 1];\n    const inc = D.incidents.find((i) => i.id === s.incidentId) || D.incidents[D.incidents.length - 1];\n    const nightIncs = D.incidents.filter((i) => i.night === night.date);\n\n    const ap = D.airports.find((a) => a.code === s.airportCode) || D.airports[0];\n    const apStats = ap.stats || { ops: 0, airline: 0, incidents: 0 };\n    const hasDetail = ap.code === 'PAE';\n    const closedLabel = (hours) => {\n      if (!hours || hours.indexOf('–') === -1) return 'No tower';\n      const [open, close] = hours.split('–').map((t) => Number(t.split(':')[0]));\n      return (24 - (close - open)) + ' hours nightly';\n    };\n\n    return Object.assign(base, {\n      apCode: ap.code,\n      apName: ap.name,\n      apPlace: ap.city + (ap.icao ? ' · ' + ap.icao : ''),\n      apTowerHours: ap.towerHours === 'no tower' ? 'No tower' : ap.towerHours,\n      apClosed: closedLabel(ap.towerHours),\n      apCarriers: ap.carriers,\n      apDetailWindow: hasDetail ? '12–18 Aug 2026' : 'Not yet published',\n      apIntro: ap.towerHours === 'no tower'\n        ? ap.name + ' has passenger airline service and no control tower at all. Nobody directs the traffic at any hour: airline pilots and small-plane pilots announce themselves on a shared radio channel and are left to spot each other to avoid collisions.'\n        : 'The tower is staffed from ' + ap.towerHours.replace('–', ' to ') + '. Outside those hours nobody is directing traffic at the airport. Airline flights are still in radio contact with regional controllers, but the small aircraft flying alongside them are only announcing themselves on a shared local channel. No one is putting the two in order, and near the airport it falls to the pilots to spot each other to avoid collisions.',\n      hasDetail: hasDetail,\n      noDetail: !hasDetail,\n      totalOps: hasDetail ? D.thirty.ops : apStats.ops,\n      totalAirline: hasDetail ? D.thirty.airline : apStats.airline,\n      totalGA: hasDetail ? D.thirty.ga : apStats.ops - apStats.airline,\n      totalIncidents: hasDetail ? D.thirty.incidents : apStats.incidents,\n      totalPositions: hasDetail ? D.thirty.positions.toLocaleString() : '—',\n      airportCount: D.airports.length,\n      trackedCount: D.airports.filter((a) => a.status === 'tracking').length,\n      pendingCount: D.airports.filter((a) => a.status === 'requested').length,\n      totalNightsLabel: '30',\n      netOps: D.airports.reduce((s2, a) => s2 + (a.stats ? a.stats.ops : 0), 0),\n      netAirline: D.airports.reduce((s2, a) => s2 + (a.stats ? a.stats.airline : 0), 0),\n      netIncidents: D.airports.reduce((s2, a) => s2 + (a.stats ? a.stats.incidents : 0), 0),\n      airportRows: D.airports.map((a) => ({\n        code: a.code, name: a.name, city: a.city, towerHours: a.towerHours, carriers: a.carriers,\n        opsLabel: a.stats ? String(a.stats.ops) : '—',\n        incLabel: a.stats ? String(a.stats.incidents) : '—',\n        incColor: a.stats && a.stats.incidents > 0 ? '#ec3013' : '#bab6b6',\n        statusLabel: a.status === 'tracking' ? 'Tracking' : a.status === 'queued' ? 'Queued' : 'Requested',\n        tagBg: a.status === 'tracking' ? '#ec3013' : a.status === 'queued' ? '#d7d3d3' : 'transparent',\n        tagFg: a.status === 'tracking' ? '#ffffff' : '#201e1d',\n        arrow: a.status === 'tracking' ? '→' : '',\n        cursor: a.status === 'tracking' ? 'pointer' : 'default',\n        opacity: a.status === 'tracking' ? 1 : 0.6,\n        codeColor: a.status === 'tracking' ? '#201e1d' : '#605d5d',\n        hint: a.status === 'tracking' ? 'Open the ' + a.code + ' record' : a.code + ' is not tracked yet',\n        open: a.status === 'tracking' ? () => { this.setState({ page: 'airport', airportCode: a.code }); window.scrollTo({ top: 0 }); } : () => {}\n      })),\n      calendar: this.calendarCells(D),\n      nightKey: night.date,\n      nightLabel: night.label,\n      nightOps: night.total,\n      nightAirline: night.airlineOps,\n      nightGA: night.gaOps,\n      nightPositions: night.positions.toLocaleString(),\n      nightFlights: night.flights.map((f) => ({\n        time: this.t12(f.time),\n        cat: f.cat === 'GA' ? 'Private / training' : f.cat,\n        dir: f.dir,\n        name: f.ident === f.tail ? f.ident : f.ident + ' (' + f.tail + ')',\n        type: f.type,\n        other: f.from,\n        dot: f.cat === 'GA' ? '#bab6b6' : '#ec3013',\n        opColor: f.cat === 'GA' ? '#605d5d' : '#201e1d',\n        opWeight: f.cat === 'GA' ? 400 : 700\n      })),\n      nightIncidents: nightIncs.map((i) => this.incidentRow(i)),\n      hasNightIncidents: nightIncs.length > 0,\n      noNightIncidents: nightIncs.length === 0,\n      incId: inc.id,\n      incSeverity: inc.severity === 'severe' ? 'Very close' : 'Closer than allowed',\n      incHeadline: inc.a.ident + ' and ' + inc.b.ident + ' came within ' + inc.lateral.toFixed(1) + ' NM and ' + inc.vertical + \"' of each other.\",\n      incWhen: inc.night_label + ', ' + this.t12(inc.time.slice(0, 5)),\n      incNote: inc.note,\n      incLateral: inc.lateral.toFixed(1) + ' NM',\n      incVertical: inc.vertical.toLocaleString() + \"'\",\n      incDist: inc.dist.toFixed(1) + ' NM',\n      incAIdent: inc.a.ident + (inc.a.tail !== inc.a.ident ? ' (' + inc.a.tail + ')' : ''),\n      incADesc: (inc.a.cat === 'GA' ? 'Private / training' : inc.a.cat) + ' · ' + inc.a.type,\n      incAAlt: inc.alt[0].toLocaleString() + ' ft',\n      incBIdent: inc.b.ident + (inc.b.tail !== inc.b.ident ? ' (' + inc.b.tail + ')' : ''),\n      incBDesc: (inc.b.cat === 'GA' ? 'Private / training' : inc.b.cat) + ' · ' + inc.b.type,\n      incBAlt: inc.alt[1].toLocaleString() + ' ft',\n      otherIncidents: D.incidents.filter((i) => i.id !== inc.id).map((i) => this.incidentRow(i))\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
