document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"8cd5b9cb-ba95-456c-ae8a-325f0745743e\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #f3f2f2; color: #201e1d; font-family: \"Archivo\", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #ae1800; text-decoration: none; border-bottom: 1px solid rgba(174,24,0,0.4); }\n  a:hover { color: #ec3013; border-bottom-color: #ec3013; }\n  button { font-family: inherit; }\n  ::selection { background: #ffc4b8; }\n  :focus-visible { outline: 2px solid #ec3013; outline-offset: 2px; }\n  .leaflet-container { font-family: \"Archivo\", sans-serif !important; background: transparent !important; }\n<\u002Fstyle>\n<script src=\"823f6568-feea-4cb1-8add-c876080f2880\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"a84c448c-3c82-4980-8631-75d06f19cda1\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<style>/* required styles */\r\n\r\n.leaflet-pane,\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow,\r\n.leaflet-tile-container,\r\n.leaflet-pane > svg,\r\n.leaflet-pane > canvas,\r\n.leaflet-zoom-box,\r\n.leaflet-image-layer,\r\n.leaflet-layer {\r\n\tposition: absolute;\r\n\tleft: 0;\r\n\ttop: 0;\r\n\t}\r\n.leaflet-container {\r\n\toverflow: hidden;\r\n\t}\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\t-webkit-user-select: none;\r\n\t   -moz-user-select: none;\r\n\t        user-select: none;\r\n\t  -webkit-user-drag: none;\r\n\t}\r\n/* Prevents IE11 from highlighting tiles in blue */\r\n.leaflet-tile::selection {\r\n\tbackground: transparent;\r\n}\r\n/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\r\n.leaflet-safari .leaflet-tile {\r\n\timage-rendering: -webkit-optimize-contrast;\r\n\t}\r\n/* hack that prevents hw layers \"stretching\" when loading new tiles */\r\n.leaf rder-bottom: 2px solid #201e1d;\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr);\">\n            <div style=\"padding: 40px 24px 32px; border-right: 1px solid #d7d3d3;\">\n              <div style=\"font-size: 64px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ netOps }}<\u002Fdiv>\n              <div style=\"margin-top: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Flights with no tower on duty<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 40px 24px 32px; border-right: 1px solid #d7d3d3;\">\n              <div style=\"font-size: 64px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ netAirline }}<\u002Fdiv>\n              <div style=\"margin-top: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Flown by passenger airlines<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 40px 24px 32px; border-right: 1px solid #d7d3d3;\">\n              <div style=\"font-size: 64px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; color: #ec3013;\">{{ netIncidents }}<\u002Fdiv>\n              <div style=\"margin-top: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Came closer than a controller would allow<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 40px 24px 32px;\">\n              <div style=\"font-size: 64px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ trackedCount }}<\u002Fdiv>\n              <div style=\"margin-top: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Airports tracked every night<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 0 24px 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Data from last 30 days<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 5fr 7fr; border-bottom: 2px solid #201e1d;\">\n          <div style=\"padding: 48px 24px; border-right: 2px solid #201e1d;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;\">{{ trackedCount }} airports tracked every night<\u002Fdiv>\n            <h1 style=\"margin: 20px 0 0; font-size: 46px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; text-wrap: pretty;\">Airliners are landing at airports where nobody is in the tower — or there is no tower at all.<\u002Fh1>\n            <p style=\"margin: 24px 0 0; max-width: 46ch; font-size: 16px; line-height: 1.55; color: #444141;\">Across the country, airports with regular passenger service have control towers that close for the night — and some have no tower at all. The flights keep coming. With nobody in the tower, no one is directing traffic: pilots announce themselves on a shared radio channel and are expected to see each other to avoid collisions. This site counts those flights and publishes every pair of aircraft that came closer than a controller would have allowed.<\u002Fp>\n            <div style=\"display: flex; gap: 12px; margin-top: 32px;\">\n              <button sc-camel-on-click=\"{{ goList }}\" style=\"padding: 14px 20px; background: #ec3013; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left;\" style-hover=\"{ background: '#dd2b0f' }\">Browse the airport records<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goAbout }}\" style=\"padding: 14px 20px; background: none; color: #201e1d; border: 2px solid #201e1d; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left;\" style-hover=\"{ background: '#eae9e9' }\">How this is measured<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: relative; background: #f3f2f2;\">\n            <x-import component-from-global-scope=\"us-airport-map\" from=\"f3147ac8-033e-4f49-8798-f28e4e3adca8#/us-map.js\" selected=\"{{ selectedCode }}\" height=\"560\" hint-size=\"100%,520px\"><\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ homeMapFirst }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n            <div style=\"padding: 56px 24px 48px; border-right: 2px solid #201e1d;\">\n              <h1 style=\"margin: 0; font-size: 58px; font-weight: 900; line-height: 0.98; letter-spacing: -0.035em; text-wrap: pretty; max-width: 18ch;\">Airliners are landing at airports where nobody is in the tower — or there is no tower at all.<\u002Fh1>\n              <p style=\"margin: 28px 0 0; max-width: 54ch; font-size: 17px; line-height: 1.55; color: #444141;\">Dozens of airports with regular passenger service have part-time or no-time control tower service: a tower that closes for the night, or no tower at all. The airline flights arrive and depart regardless. With no controller on duty, nothing is directing the traffic — airline and small-plane pilots announce themselves on a shared radio channel and are left to spot each other to avoid collisions. This site records what happens during those hours.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-rows: 1fr 1fr 1fr auto;\">\n              <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3; display: flex; align-items: center; gap: 16px;\">\n                <div style=\"font-size: 52px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; min-width: 100px;\">{{ netOps }}<\u002Fdiv>\n                <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Flights in and out with the tower closed<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3; display: flex; align-items: center; gap: 16px;\">\n                <div style=\"font-size: 52px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; min-width: 100px;\">{{ netAirline }}<\u002Fdiv>\n                <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Flown by passenger airlines<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 24px; display: flex; align-items: center; gap: 16px;\">\n                <div style=\"font-size: 52px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; min-width: 100px; color: #ec3013;\">{{ netIncidents }}<\u002Fdiv>\n                <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Pairs of aircraft that came closer than a controller would allow<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding: 0 24px 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Data from last 30 days<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-bottom: 2px solid #201e1d; position: relative;\">\n            <x-import component-from-global-scope=\"us-airport-map\" from=\"f3147ac8-033e-4f49-8798-f28e4e3adca8#/us-map.js\" selected=\"{{ selectedCode }}\" height=\"640\" hint-size=\"100%,600px\"><\u002Fx-import>\n            <div style=\"position: absolute; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; background: #f3f2f2; border: 2px solid #201e1d; padding: 16px 20px;\">\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #201e1d;\">Close approaches, last 30 days<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; color: #444141;\"><span style=\"width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #ec3013; background: rgba(236,48,19,0.22); display: block; flex-shrink: 0;\"><\u002Fspan> Tracked airport — circle grows with the count<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; color: #444141;\"><span style=\"width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #201e1d; background: rgba(32,30,29,0.12); display: block; flex-shrink: 0;\"><\u002Fspan> Tracked airport — none found<\u002Fdiv>\n              <div style=\"font-size: 12px; color: #7d7979; max-width: 30ch; line-height: 1.4;\">Airports still under review are listed on the Airports page, not shown here.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"padding: 44px 24px 52px; display: flex; align-items: center; justify-content: space-between; gap: 32px; border-bottom: 2px solid #201e1d;\">\n        <div style=\"max-width: 62ch; font-size: 17px; line-height: 1.55; color: #444141;\">Not seeing your airport? Ask us to start tracking it.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goAirports }}\" style=\"padding: 14px 20px; background: #ec3013; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left; white-space: nowrap;\" style-hover=\"{ background: '#dd2b0f' }\">Airport list and submissions<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAirports }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 48px 24px; border-right: 2px solid #201e1d;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;\">Coverage<\u002Fdiv>\n          <h1 style=\"margin: 18px 0 0; font-size: 42px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; max-width: 20ch;\">Airports tracked<\u002Fh1>\n          <p style=\"margin: 20px 0 0; max-width: 58ch; font-size: 16px; line-height: 1.55; color: #444141;\">We track airports with regular passenger service and part-time or no-time control tower service: a tower that closes while those flights are still arriving and leaving, or no tower at all.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3; border-right: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 40px; font-weight: 900; letter-spacing: -0.03em;\">{{ trackedCount }}<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Airports tracked<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 40px; font-weight: 900; letter-spacing: -0.03em; color: #ec3013;\">{{ netIncidents }}<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Close approaches<br>last 30 days<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px; border-right: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 40px; font-weight: 900; letter-spacing: -0.03em;\">{{ pendingCount }}<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Requested<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 24px;\">\n            <div style=\"font-size: 40px; font-weight: 900; letter-spacing: -0.03em;\">{{ totalNightsLabel }}<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Nights covered<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"airport-list\" style=\"border-bottom: 2px solid #201e1d;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; padding: 32px 24px 20px;\">\n          <h2 style=\"margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;\">All airports<\u002Fh2>\n          <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7d7979;\">Counts from last 30 days<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 0 24px 40px;\">\n          <div style=\"display: grid; grid-template-columns: 80px 1.5fr 1fr 1fr 100px 120px 128px 36px; gap: 0; border-top: 2px solid #201e1d; border-bottom: 1px solid #d7d3d3; padding: 10px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">\n            <div>Code<\u002Fdiv><div>Airport<\u002Fdiv><div>City<\u002Fdiv><div>Tower hours<\u002Fdiv><div>Flights<\u002Fdiv><div>Close approaches<\u002Fdiv><div>Status<\u002Fdiv><div><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ airportRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ a.open }}\" title=\"{{ a.hint }}\" style=\"display: grid; grid-template-columns: 80px 1.5fr 1fr 1fr 100px 120px 128px 36px; align-items: center; border-bottom: 1px solid #d7d3d3; padding: 14px 0; cursor: {{ a.cursor }}; opacity: {{ a.opacity }};\" style-hover=\"{ background: '#eae9e9' }\">\n              <div style=\"font-size: 17px; font-weight: 800; letter-spacing: 0.02em; color: {{ a.codeColor }};\">{{ a.code }}<\u002Fdiv>\n              <div style=\"font-size: 14px; font-weight: 500;\">{{ a.name }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #605d5d;\">{{ a.city }}<\u002Fdiv>\n              <div style=\"font-size: 14px; color: #605d5d;\">{{ a.towerHours }}<\u002Fdiv>\n              <div style=\"font-size: 15px; font-variant-numeric: tabular-nums;\">{{ a.opsLabel }}<\u002Fdiv>\n              <div style=\"font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; color: {{ a.incColor }};\">{{ a.incLabel }}<\u002Fdiv>\n              <div><span style=\"display: inline-block; padding: 4px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: {{ a.tagBg }}; color: {{ a.tagFg }};\">{{ a.statusLabel }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size: 18px; font-weight: 700; color: #ae1800; text-align: right;\">{{ a.arrow }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #ec3013; color: #fff; border-bottom: 2px solid #201e1d;\">\n        <div style=\"display: grid; grid-template-columns: 7fr 5fr;\">\n          <div style=\"padding: 56px 24px;\">\n            <h2 style=\"margin: 0; font-size: 40px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; max-width: 20ch;\">If your airport has passenger flights and part-time or no-time tower service, put it on the map.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 24px; border-left: 2px solid #fff;\">\n            <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n              <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n                <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85;\">Airport code or city, state<\u002Fspan>\n                <input value=\"{{ addValue }}\" sc-camel-on-change=\"{{ onAddChange }}\" placeholder=\"BLI — or — Bellingham, WA\" style=\"padding: 13px 14px; background: #fff; color: #201e1d; border: none; font-family: Archivo, sans-serif; font-size: 15px;\">\n              <\u002Flabel>\n              <label style=\"display: flex; flex-direction: column; gap: 6px;\">\n                <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85;\">Your email<\u002Fspan>\n                <input value=\"{{ addEmail }}\" sc-camel-on-change=\"{{ onEmailChange }}\" placeholder=\"you@example.org\" style=\"padding: 13px 14px; background: #fff; color: #201e1d; border: none; font-family: Archivo, sans-serif; font-size: 15px;\">\n              <\u002Flabel>\n              <button sc-camel-on-click=\"{{ submitAdd }}\" style=\"padding: 14px 20px; background: #201e1d; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left;\" style-hover=\"{ background: '#000' }\">Send request<\u002Fbutton>\n              <sc-if value=\"{{ addSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding: 12px 14px; background: rgba(255,255,255,0.16); font-size: 14px; line-height: 1.5;\">{{ addMessage }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAirport }}\" hint-placeholder-val=\"{{ false }}\">\n    <div>\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 40px 24px; border-right: 2px solid #201e1d;\">\n          <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #ec3013;\">Tracked nightly · within 10 nautical miles<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 18px; margin-top: 14px;\">\n            <div style=\"font-size: 66px; font-weight: 900; line-height: 0.85; letter-spacing: -0.04em;\">{{ apCode }}<\u002Fdiv>\n            <div>\n              <div style=\"font-size: 22px; font-weight: 700; letter-spacing: -0.01em;\">{{ apName }}<\u002Fdiv>\n              <div style=\"font-size: 15px; color: #605d5d;\">{{ apPlace }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 22px 0 0; max-width: 60ch; font-size: 16px; line-height: 1.55; color: #444141;\">{{ apIntro }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr;\">\n          <div style=\"padding: 22px 20px; border-bottom: 1px solid #d7d3d3; border-right: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Tower hours<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 20px; font-weight: 700;\">{{ apTowerHours }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 22px 20px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Hours closed<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 20px; font-weight: 700;\">{{ apClosed }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 22px 20px; border-right: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Airlines serving<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 20px; font-weight: 700;\">{{ apCarriers }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 22px 20px;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #7d7979;\">Detailed data<\u002Fdiv>\n            <div style=\"margin-top: 8px; font-size: 20px; font-weight: 700;\">{{ apDetailWindow }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 20px 24px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7d7979;\">Over the last 30 days · hours the tower was closed<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid #201e1d;\">\n        <div style=\"padding: 28px 20px; border-right: 1px solid #d7d3d3;\">\n          <div style=\"font-size: 44px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ totalOps }}<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Flights in and out<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 20px; border-right: 1px solid #d7d3d3;\">\n          <div style=\"font-size: 44px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ totalAirline }}<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Passenger airline<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 20px; border-right: 1px solid #d7d3d3;\">\n          <div style=\"font-size: 44px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em;\">{{ totalGA }}<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Private and training aircraft<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 20px;\">\n          <div style=\"font-size: 44px; font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; color: #ec3013;\">{{ totalIncidents }}<\u002Fdiv>\n          <div style=\"margin-top: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #605d5d;\">Close approaches<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ noDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 48px 24px 64px; border-bottom: 2px solid #201e1d;\">\n          <div style=\"font-size: 20px; font-weight: 800; letter-spacing: -0.01em;\">Nightly detail for {{ apCode }} is not published yet.<\u002Fdiv>\n          <p style=\"margin: 12px 0 0; max-width: 60ch; font-size: 16px; line-height: 1.55; color: #605d5d;\">The totals above cover the last 30 days. Flight paths and individual close approaches are available for Paine Field.<\u002Fp>\n          <button sc-camel-on-click=\"{{ goPAE }}\" style=\"margin-top: 24px; padding: 14px 20px; background: #ec3013; color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: left;\" style-hover=\"{ background: '#dd2b0f' }\">See the Paine Field record<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n      <div style=\"padding: 36px 24px; border-bottom: 2px solid #201e1d;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px;\">\n          <h2 style=\"margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em;\">Last 30 days<\u002Fh2>\n          <div style=\"display: flex; align-items: center; gap: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7d7979;\">\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: #d7d3d3; display: block;\"><\u002Fspan>Fewer flights<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: #444141; display: block;\"><\u002Fspan>More flights<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: #ec3013; display: block;\"><\u002Fspan>Close approach<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(15, 1fr); gap: 6px;\">\n          <sc-for list=\"{{ calendar }}\" as=\"c\" hint-placeholder-count=\"30\">\n            <button sc-camel-on-click=\"{{ c.pick }}\" title=\"{{ c.title }}\" style=\"display: block; padding: 0; border: none; background: none; cursor: pointer; text-align: left;\">\n              <div style=\"border: 2px solid {{ c.border }}; padding: 8px 8px 10px; min-height: 78px; display: flex; flex-direction: column; justify-content: space-between; background: {{ c.bg }}; color: {{ c.fg }};\">\n                <div style=\"font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7;\">{{ c.dow }}<\u002Fdiv>\n                <div>\n                  <div style=\"font-size: 17px; font-weight: 800; line-height: 1;\">{{ c.day }}<\u002Fdiv>\n                  <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.06em; opacity: 0.8; margin-top: 3px;\">{{ c.opsLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top: 14px; font-size: 12px; color: #7d7979;\">Counts cover the last 30 days. The nights of 12–18 August have full flight-path detail; earlier nights in the window contribute flight counts only.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; border-bottom: 2px solid #201e1d;\">\n        <div style=\"border-right: 2px solid #201e1d;\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"min-width: 0;\">\n              <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7d7979;\">Flight paths within 10 nautical miles, tower closed<\u002Fdiv>\n              <h2 style=\"margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;\">Night of {{ nightLabel }}<\u002Fh2>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"flight-map\" from=\"e373428c-3b12-44a0-92d3-b46730c4f578#/flight-map.js\" night=\"{{ nightKey }}\" mode=\"{{ mapMode }}\" interactive=\"true\" height=\"560\" hint-size=\"100%,560px\"><\u002Fx-import>\n          <div style=\"display: flex; align-items: center; gap: 24px; padding: 14px 24px; border-top: 1px solid #d7d3d3; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #605d5d;\">\n            <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 20px; height: 3px; background: #ec3013; display: block;\"><\u002Fspan>Passenger airline<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 20px; height: 2px; background: #201e1d; display: block;\"><\u002Fspan>Private and training aircraft<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 8px;\"><span style=\"width: 10px; height: 10px; border: 1px solid #201e1d; border-radius: 50%; display: block;\"><\u002Fspan>10 nautical mile ring<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"padding: 20px 24px; border-bottom: 1px solid #d7d3d3;\">\n            <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7d7979;\">Close approaches this night<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasNightIncidents }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <sc-for list=\"{{ nightIncidents }}\" as=\"i\" hint-placeholder-count=\"1\">\n                <button sc-camel-on-click=\"{{ i.open }}\" style=\"display: block; width: 100%; text-align: left; padding: 22px 24px; background: #fff2ef; border: none; border-bottom: 1px solid #d7d3d3; border-left: 6px solid #ec3013; cursor: pointer;\" style-hover=\"{ background: '#ffe0d9' }\">\n                  <div style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n                    <span style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #ae1800;\">{{ i.severity }}<\u002Fspan>\n                    <span style=\"font-size: 12px; color: #7d7979;\">{{ i.time }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin-top: 12px; font-size: 20px; font-weight: 800; letter-spacing: -0.01em;\">{{ i.pair }}<\u002Fdiv>\n                  <div style=\"display: flex; gap: 24px; margin-top: 14px;\">\n                    <div>\n                      <div style=\"font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #ec3013;\">{{ i.lateral }}<\u002Fdiv>\n                      <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">Less than 3 NM<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"font-size: 26px; font-weight: 900; letter-spacing: -0.02em; color: #ec3013;\">{{ i.vertical }}<\u002Fdiv>\n                      <div style=\"font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #605d5d;\">Less than 1,000'<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top: 14px; font-size: 13px; font-weight: 700; color: #ae1800;\">See what happened →<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noNightIncidents }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 24px; font-size: 15px; line-height: 1.55; color: #605d5d; border-bottom: 1px solid #d7d3d3;\">No two aircraft came
